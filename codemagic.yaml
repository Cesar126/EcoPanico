# Codemagic Configuration File
# This file overrides the visual editor to ensure CocoaPods are fully installed
# and Flutter project files are generated before running Xcode compilations.

workflows:
  default-workflow:
    name: Eco Panico Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
    scripts:
      - name: Install Flutter dependencies
        script: |
          flutter pub get
      - name: Build iOS IPA
        script: |
          flutter build ipa --no-codesign
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/iphoneos/Payload
          cd build/ios/iphoneos
          zip -r Runner.ipa Payload
          rm -rf Payload
      - name: Build Android APK
        script: |
          flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*-release.apk
      - build/ios/iphoneos/*.ipa
